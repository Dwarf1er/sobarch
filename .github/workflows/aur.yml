name: AUR update check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base
    outputs:
      packages: ${{ steps.check.outputs.packages }}
    steps:
      - name: Install check dependencies
        run: pacman -Sy --needed --noconfirm curl jq git
      - uses: actions/checkout@v7.0.1
      - id: check
        run: |
          scripts/aur-sync/check-aur-updates.sh > outdated.txt
          json="$(cut -d' ' -f1 outdated.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.check.outputs.packages) }}
    steps:
      - name: Install update dependencies
        run: pacman -Sy --needed --noconfirm git jq github-cli
      - uses: actions/checkout@v7.0.1
      - name: Trust workspace as root despite the build user's chown below
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder .
      - name: Stage update
        env:
          PKG: ${{ matrix.package }}
        run: runuser -u builder -- scripts/aur-sync/apply-aur-update.sh "$PKG"
      - name: Check for actual changes
        id: diff
        env:
          PKG: ${{ matrix.package }}
        run: |
          if git diff --quiet -- "packages/aur/$PKG"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          newver="$(awk -F' = ' '/^\tpkgver = /{v=$2} /^\tpkgrel = /{r=$2} END{print v"-"r}' "packages/aur/$PKG/.SRCINFO")"
          branch="aur-update/${PKG}-${newver//:/-}"

          if [[ -n "$(gh pr list --state open --head "$branch" --json number --jq '.[0].number')" ]]; then
            echo "PR for $branch already open, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "packages/aur/$PKG"
          git commit -m "aur: update $PKG to $newver"
          # Force: this branch name is entirely derived from
          # $PKG+$newver above, so it's owned by this automation alone
          # -- a stale ref left by an earlier run that pushed but
          # failed before/at `gh pr create` (no open PR, so the guard
          # above didn't catch it) must never block this run from
          # reaching the same state.
          git push --force origin "$branch"

          {
            echo "Automated update of \`$PKG\` to \`$newver\`, fetched from its AUR git repo."
            echo
            echo "Requires human review before merge (no auto-merge configured); check the diff for anything beyond the version bump before approving. namcap/aur-scan results are on the Checks tab, run automatically against this PR."
          } > pr-body.txt
          gh pr create --title "aur: update $PKG to $newver" --head "$branch" --base master --body-file pr-body.txt

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
