name: AUR update check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base
    outputs:
      packages: ${{ steps.check.outputs.packages }}
    steps:
      - name: Install check dependencies
        run: pacman -Sy --needed --noconfirm curl jq git
      - uses: actions/checkout@v7.0.1
      - id: check
        run: |
          scripts/aur-sync/check-aur-updates.sh > outdated.txt
          json="$(cut -d' ' -f1 outdated.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.check.outputs.packages) }}
    steps:
      - name: Install update dependencies
        run: pacman -Sy --needed --noconfirm git jq github-cli
      - uses: actions/checkout@v7.0.1
      - name: Trust workspace as root despite the build user's chown below
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder .
      - name: Stage update
        env:
          PKG: ${{ matrix.package }}
        run: runuser -u builder -- scripts/aur-sync/apply-aur-update.sh "$PKG"
      - name: Check for actual changes
        id: diff
        env:
          PKG: ${{ matrix.package }}
        run: |
          if git diff --quiet -- "packages/aur/$PKG"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install check dependencies
        if: steps.diff.outputs.changed == 'true'
        run: pacman -Sy --needed --noconfirm namcap
      # The compiled scanner only changes when aur-scan.version does, so
      # the rust toolchain install and ~2.5 minute build happen once per
      # version bump instead of once per matrix package per run.
      - name: Cache aur-scan
        if: steps.diff.outputs.changed == 'true'
        id: aur-scan-cache
        uses: actions/cache@v4.2.0
        with:
          path: /usr/local/bin/aur-scan
          key: aur-scan-${{ hashFiles('.github/scripts/aur-scan.version') }}
      - name: Validate PKGBUILD
        if: steps.diff.outputs.changed == 'true'
        id: validate
        env:
          PKG: ${{ matrix.package }}
        run: |
          set +e
          runuser -u builder -- .github/scripts/validate-vendored-pkgbuilds.sh "$PKG" 2>&1 | tee "$RUNNER_TEMP/validate.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Security scan
        if: steps.diff.outputs.changed == 'true'
        env:
          PKG: ${{ matrix.package }}
        run: |
          if [[ "${{ steps.aur-scan-cache.outputs.cache-hit }}" != 'true' ]]; then
            pacman -S --needed --noconfirm rust clang openssl
            .github/scripts/build-aur-scan.sh /usr/local/bin/aur-scan
          fi
          # Advisory only, same as namcap: findings need a human's
          # judgment, never block the update on their own.
          aur-scan scan "packages/aur/$PKG/" --format text 2>&1 | tee "$RUNNER_TEMP/scan.log" || true
      - name: Fail if validation failed
        if: steps.diff.outputs.changed == 'true' && steps.validate.outputs.rc != '0'
        run: exit 1
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          newver="$(awk -F' = ' '/^\tpkgver = /{v=$2} /^\tpkgrel = /{r=$2} END{print v"-"r}' "packages/aur/$PKG/.SRCINFO")"
          title="aur: update $PKG to $newver"
          desc="Automated update of \`$PKG\` to \`$newver\`, fetched from its AUR git repo."
          if [[ "$PKG" == *-git ]]; then
            # A VCS package's pkgver is stale bookkeeping, not a real
            # version; the update is the maintainer's PKGBUILD content.
            title="aur: content update for $PKG"
            desc="Automated content update of \`$PKG\` (VCS package, so no meaningful version), fetched from its AUR git repo."
          fi
          .github/scripts/open-update-pr.sh "aur-update/${PKG}-${newver//:/-}" "$title" "$desc" "packages/aur/$PKG" validate scan

  # tinty-bin repackages upstream's GitHub release binary (the AUR has
  # only tinty-git), so the AUR check above can't see it.
  tinty-bin:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Sy --needed --noconfirm git github-cli
      - uses: actions/checkout@v7.0.1
      - name: Trust workspace as root despite the build user's chown below
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder .
      - name: Update to the latest release
        run: runuser -u builder -- .github/scripts/update-tinty-bin.sh
      - name: Check for actual changes
        id: diff
        run: |
          if git diff --quiet -- packages/custom/tinty-bin; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate PKGBUILD
        if: steps.diff.outputs.changed == 'true'
        # bash explicitly: its pipefail is what lets a validator failure
        # survive the pipe into tee.
        shell: bash
        run: runuser -u builder -- .github/scripts/validate-custom-pkgbuilds.sh 2>&1 | tee "$RUNNER_TEMP/validate.log"
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          newver="$(grep -oP '^pkgver=\K.*' packages/custom/tinty-bin/PKGBUILD)"
          .github/scripts/open-update-pr.sh "tinty-bin-update/${newver}" \
            "custom: update tinty-bin to $newver" \
            "Automated update of \`tinty-bin\` to upstream release \`v$newver\`, from https://github.com/tinted-theming/tinty/releases/tag/v$newver. Checksums were computed from the downloaded files; the binary's was cross-checked against the release's own published \`.sha256\`." \
            packages/custom/tinty-bin validate

  # vesktop-integrity-launch pins an exact commit of its own upstream
  # repo; this bumps the pin to that repo's current HEAD.
  vesktop-integrity-launch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Sy --needed --noconfirm git github-cli
      - uses: actions/checkout@v7.0.1
      - name: Trust workspace as root despite the build user's chown below
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder .
      - name: Update to upstream HEAD
        run: runuser -u builder -- .github/scripts/update-vesktop-integrity-launch.sh
      - name: Check for actual changes
        id: diff
        run: |
          if git diff --quiet -- packages/custom/vesktop-integrity-launch; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate PKGBUILD
        if: steps.diff.outputs.changed == 'true'
        # bash explicitly: its pipefail is what lets a validator failure
        # survive the pipe into tee.
        shell: bash
        run: runuser -u builder -- .github/scripts/validate-custom-pkgbuilds.sh 2>&1 | tee "$RUNNER_TEMP/validate.log"
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pkg=packages/custom/vesktop-integrity-launch
          old="$(git show "HEAD:$pkg/PKGBUILD" | grep -oP '^_commit=\K.*')"
          new="$(grep -oP '^_commit=\K.*' "$pkg/PKGBUILD")"
          .github/scripts/open-update-pr.sh "vesktop-integrity-launch-update/${new:0:7}" \
            "custom: update vesktop-integrity-launch to ${new:0:7}" \
            "Automated bump of the pinned upstream commit of \`vesktop-integrity-launch\`: https://github.com/Dwarf1er/vesktop-integrity-launch/compare/${old}...${new}. The launcher runs on users' machines, so read that diff before merging, not just this one." \
            "$pkg" validate
