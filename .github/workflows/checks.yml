name: Checks

# PR-time validation for AUR-sourced content specifically (packages/aur/)
on:
  pull_request:
    paths:
      - 'packages/aur/**'
  workflow_dispatch: {}

jobs:
  pkgbuild-validate:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install validate dependencies
        run: pacman -Sy --needed --noconfirm namcap
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder .
      - name: Validate vendored PKGBUILDs
        run: runuser -u builder -- .github/scripts/validate-vendored-pkgbuilds.sh

  security-scan:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: pacman -Sy --needed --noconfirm rust clang openssl git
      - name: Build aur-scan
        run: .github/scripts/build-aur-scan.sh /usr/local/bin/aur-scan
      - name: Scan vendored packages
        run: |
          for dir in packages/aur/*/; do
            [[ -d "$dir" ]] || continue
            echo "== $(basename "$dir") =="
            # Advisory only, same as namcap: findings need a human's
            # judgment, never block the check on their own.
            aur-scan scan "$dir" --format text || true
          done
