name: ISO build

# Monthly prebuilt ISO (Arch releng profile plus the installer),
# published as a GitHub Release.
#
# Requires the SOBARCH_ISO_GPG_PRIVATE_KEY secret: an ASCII-armored,
# passphrase-less GPG private key.

on:
  schedule:
    # A few days after Arch's own monthly ISO.
    - cron: '0 6 5 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: pacman -Sy --needed --noconfirm archiso git rsync python gnupg github-cli

      - name: Build ISO
        run: scripts/iso-build/build-iso.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/iso"

      - name: Sign ISO
        # Detached binary signature, verified against the committed
        # sobarch-iso-signing.asc.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.SOBARCH_ISO_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/iso"
          iso="$(find . -maxdepth 1 -name '*.iso')"

          gpg --batch --import <<< "$GPG_PRIVATE_KEY"
          gpg --batch --yes --detach-sign "$iso"

      - name: Publish release
        # The signing key lives in the repo, so it isn't uploaded. --repo is
        # needed because gh can't infer the repo outside the checkout.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/iso"
          iso="$(find . -maxdepth 1 -name '*.iso')"
          tag="iso-$(date -u +%Y.%m.%d)"
          gh release create "$tag" "$iso" "$iso.sig" \
              --repo "$GITHUB_REPOSITORY" \
              --title "sobarch $tag" \
              --notes "Monthly prebuilt installer ISO. Verify against sobarch-iso-signing.asc in this repo (see README.md)."
