name: Release

# Pushing a tag like v2026.10.1 publishes a GitHub Release with notes
# generated from the commits since the previous tag. Tag master only.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "sobarch $GITHUB_REF_NAME" \
              --generate-notes
