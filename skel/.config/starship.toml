# Base16 OneDark
# Author: Lalit Magant (http://github.com/tilal6991)
#
# starship.toml has no include directive, so this template renders the
# whole file, static settings included, rather than just a color snippet.

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration
$character"""

right_format = ""
add_newline = true

[fill]
symbol = " "

[directory]
style = "bold fg:#61afef"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "fg:#56b6c2"
symbol = " "

[git_status]
style = "fg:#e06c75"

[cmd_duration]
min_time = 2000
style = "fg:#e5c07b"

[character]
success_symbol = "[❯](bold fg:#98c379)"
error_symbol = "[❯](bold fg:#e06c75)"
