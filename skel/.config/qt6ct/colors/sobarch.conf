[ColorScheme]
# Base16 OneDark
# Author: Lalit Magant (http://github.com/tilal6991)
#
# Ported directly from the upstream base16-qt5ct mapping
# (https://github.com/mnussbaum/base16-qt5ct), same 21-role QPalette
# order, with a 22nd trailing value for Qt6's Accent role (mirroring
# role 13, Highlight, the same convention qt6ct's own stock schemes use).
