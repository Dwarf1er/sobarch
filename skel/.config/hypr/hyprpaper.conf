# `~` is documented as supported here, but has a real, recurring
# history of silently failing to resolve in hyprpaper specifically
# (hyprwm/hyprpaper#110, same exact `~/file.jpg` shape as below).
# `$HOME` isn't the same mechanism: hyprpaper's config parser
# (hyprlang, a separate library from Hyprland's own now-Lua config,
# still used here) does its own `$VAR` environment-variable
# substitution, unrelated to and more reliable than a tool
# implementing shell-style tilde-expansion itself.
#
# Only a placeholder for the brief window between hyprpaper's own
# startup and apply-wallpaper.sh's first run in the same autostart
# sequence (hyprland.lua's `tinty init`, unconditional on every
# login): that call overrides this via hyprpaper's runtime IPC with
# whatever's actually selected (~/.config/sobarch/current-wallpaper),
# recolored for the current theme if it's an SVG. Points at sobarch's
# own shipped default so that brief window shows something sensible
# rather than an arbitrary personal wallpaper file.
wallpaper {
    monitor =
    path = $HOME/.local/share/backgrounds/sobarch-wallpaper.svg
}

splash = false
