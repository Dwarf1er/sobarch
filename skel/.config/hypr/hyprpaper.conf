# $HOME rather than `~`, which hyprpaper sometimes fails to expand (hyprwm/hyprpaper#110).
# Placeholder until apply-wallpaper.sh sets the selected wallpaper at login.
# whatever's actually selected (~/.config/sobarch/current-wallpaper),
# recolored for the current theme if it's an SVG. Points at sobarch's
# own shipped default so that brief window shows something sensible
# rather than an arbitrary personal wallpaper file.
wallpaper {
    monitor =
    path = $HOME/.local/share/backgrounds/sobarch-wallpaper.svg
}

splash = false
