# Base16 OneDark
# Author: Lalit Magant (http://github.com/tilal6991)
#
# hyprlock has no config-splitting directive (unlike hyprland.conf's
# `source=`), so this template renders the whole file, static settings
# included, rather than just a color snippet.

# Solid color, no screenshot/blur: a blurred capture of the last frame
# reads as noise behind the labels below and tanks contrast, so the
# lock screen is a flat panel with the mark instead.
background {
    monitor =
    path =
    color = rgba(282c34ff)
}

image {
    monitor =
    path = ~/.config/hypr/sobarch-logo.png
    size = 130
    position = 0, 380
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(abb2bfff)
    font_size = 96
    font_family = D2CodingLigature Nerd Font Mono
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(56b6c2ff)
    font_size = 20
    font_family = D2CodingLigature Nerd Font Mono
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "$USER"
    color = rgba(61afefff)
    font_size = 16
    font_family = D2CodingLigature Nerd Font Mono
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 3
    inner_color = rgba(00000000)

    outer_color = rgba(61afefee) rgba(56b6c2ee) 45deg
    check_color = rgba(98c379ee) rgba(56b6c2ee) 120deg
    fail_color = rgba(e06c75ee) rgba(be5046ee) 40deg

    font_color = rgb(abb2bf)
    fade_on_empty = false
    rounding = 28
    position = 0, 0
    halign = center
    valign = center
}
