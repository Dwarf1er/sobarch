# Base16 OneDark
# Author: Lalit Magant (http://github.com/tilal6991)
# Renders the whole file: hyprlock has no include directive.

# Flat color rather than a blurred screenshot, which hurt label contrast.
background {
    monitor =
    path =
    color = rgba(282c34ff)
}

# The clock/date/logo/username/input stack is spaced as one group centered
# on screen; retune it as a whole.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(abb2bfff)
    font_size = 96
    font_family = D2CodingLigature Nerd Font Mono
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(56b6c2ff)
    font_size = 20
    font_family = D2CodingLigature Nerd Font Mono
    position = 0, 80
    halign = center
    valign = center
}

# rounding = -1 crops to a circle; the PNG is padded so the mark isn't clipped.
image {
    monitor =
    path = ~/.config/hypr/sobarch-logo.png
    size = 130
    rounding = -1
    position = 0, -25
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "$USER"
    color = rgba(61afefff)
    font_size = 16
    font_family = D2CodingLigature Nerd Font Mono
    position = 0, -130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 3
    inner_color = rgba(00000000)

    outer_color = rgba(61afefee) rgba(56b6c2ee) 45deg
    check_color = rgba(98c379ee) rgba(56b6c2ee) 120deg
    fail_color = rgba(e06c75ee) rgba(be5046ee) 40deg

    font_color = rgb(abb2bf)
    fade_on_empty = false
    rounding = 28
    position = 0, -190
    halign = center
    valign = center
}
