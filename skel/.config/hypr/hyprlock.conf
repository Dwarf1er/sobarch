# Base16 OneDark
# Author: Lalit Magant (http://github.com/tilal6991)
#
# hyprlock has no config-splitting directive (unlike hyprland.conf's
# `source=`), so this template renders the whole file, static settings
# included, rather than just a color snippet.

background {
    monitor =
    path = screenshot
    color = rgba(282c34ff)
    blur_passes = 2
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(00000000)

    outer_color = rgba(61afefee) rgba(56b6c2ee) 45deg
    check_color = rgba(98c379ee) rgba(56b6c2ee) 120deg
    fail_color = rgba(e06c75ee) rgba(be5046ee) 40deg

    font_color = rgb(abb2bf)
    fade_on_empty = false
    rounding = 15
}
