# Configuration for Tinty (https://github.com/tinted-theming/tinty)
#
# One [[items]] block per themed app. Reused upstream templates for
# kitty/hyprland; everything else is authored locally under
# ~/.config/sobarch/tinty-templates/ (no upstream template exists for
# them). `tinty apply`/`install`/`sync` never render a template on
# their own (confirmed by reading tinty's own source: `apply` only
# copies an already-rendered file out of each item's `themes-dir`), so
# every scheme for these local items has to be built explicitly via
# `tinty build <item-dir>` before `apply` can find it -- done by
# build-tinty-templates.sh, not committed to the repo as static output
# (see docs/DECISIONS.md).
#
# `revision` below pins the schemes repo tinty renders these local
# items against, independently of whatever revision is compiled into
# whichever tinty binary is installed, so the rendered output stays
# reproducible across installs/updates.

default-scheme = "base16-onedark"

[schemes]
revision = "spec-0.11"

[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-terminal-kitty"
themes-dir = "themes/kitty"
write-to-file = ["~/.config/kitty/onedark.conf"]
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "~/.config/sobarch/tinty-templates/waybar-css"
name = "sobarch-waybar-css"
themes-dir = "colors"
write-to-file = ["~/.config/waybar/colors.css"]
# Authored locally instead of reused from tinted-theming/base16-waybar:
# see waybar-css/templates/default.mustache's own comment on why.
#
# apply-wallpaper.sh's own hook is attached here rather than to a
# dedicated tinty item: it reads base00/base0D straight out of this
# item's own colors.css (no separate wallpaper-specific template to
# keep in sync), so hooking its own write is the actual dependency,
# not a borrowed one.
hook = "~/.config/hypr/scripts/apply-wallpaper.sh"
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "~/.config/sobarch/tinty-templates/waybar-jsonc"
name = "sobarch-waybar-jsonc"
themes-dir = "colors"
write-to-file = ["~/.config/waybar/config.jsonc"]
# Unlike hyprland's `hyprctl reload`/mako's `makoctl reload`, waybar has
# no live file-watcher for colors.css or config.jsonc. A prior version
# of this hook sent SIGUSR2, on the assumption that's a full reload;
# it isn't -- per waybar(5), SIGUSR2 only reloads style.css, config.jsonc
# changes need the process actually restarted, and even the style-only
# reload has a known bug where it doesn't apply fully
# (Alexays/Waybar#3986). Since this item's own template renders the
# whole config.jsonc, not just CSS vars (see waybar-jsonc/templates/
# default.mustache's own comment on why), a real restart is required,
# not optional. Waits for the old process to actually exit (bounded to
# 1s) before relaunching, rather than racing a `waybar &` against a
# not-yet-dead old instance for the same layer-shell surface. Placed on
# this item, not sobarch-waybar-css's (colors.css), since this one runs
# last and both files (colors.css, just written by that earlier item,
# and config.jsonc, written here) need to already be on disk before the
# restart happens.
hook = "pkill -x waybar; i=0; while pgrep -x waybar >/dev/null 2>&1 && [ $i -lt 20 ]; do sleep 0.05; i=$((i+1)); done; waybar &"
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "https://github.com/janfreeman/base16-hyprland-lua"
name = "base16-hyprland-lua"
themes-dir = "colors"
write-to-file = ["~/.config/hypr/colors.lua"]
hook = "hyprctl reload"
supported-systems = ["base16"]

[[items]]
path = "~/.config/sobarch/tinty-templates/mako"
name = "sobarch-mako"
themes-dir = "colors"
write-to-file = ["~/.config/mako/colors"]
hook = "makoctl reload"
supported-systems = ["base16", "base24", "tinted8"]

