# Base configuration for Tinty (https://github.com/tinted-theming/tinty).
# tinty-config.sh joins this with local.toml into config.toml, which is the
# file tinty reads. Your own items go in local.toml.
#
# Local items under ~/.config/sobarch/tinty-templates/ must be rendered with
# build-tinty-templates.sh before `tinty apply` can use them.

default-scheme = "base16-onedark"

[schemes]
revision = "spec-0.11"

[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-terminal-kitty"
themes-dir = "themes/kitty"
write-to-file = ["~/.config/kitty/onedark.conf"]
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "~/.config/sobarch/tinty-templates/waybar-css"
name = "sobarch-waybar-css"
themes-dir = "colors"
write-to-file = ["~/.config/waybar/colors.css"]
# The wallpaper is colored from this item's colors.css.
hook = "~/.config/hypr/scripts/apply-wallpaper.sh"
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "~/.config/sobarch/tinty-templates/waybar-jsonc"
name = "sobarch-waybar-jsonc"
themes-dir = "colors"
write-to-file = ["~/.config/waybar/calendar.jsonc"]
# SIGUSR2 doesn't reload config.jsonc or its includes, so waybar must be restarted. Kept on
# the item after waybar-css so both files are written first.
hook = "pkill -x waybar; i=0; while pgrep -x waybar >/dev/null 2>&1 && [ $i -lt 20 ]; do sleep 0.05; i=$((i+1)); done; waybar &"
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "https://github.com/janfreeman/base16-hyprland-lua"
name = "base16-hyprland-lua"
themes-dir = "colors"
write-to-file = ["~/.config/hypr/colors.lua"]
hook = "hyprctl reload"
supported-systems = ["base16"]

[[items]]
path = "~/.config/sobarch/tinty-templates/mako"
name = "sobarch-mako"
themes-dir = "colors"
write-to-file = ["~/.config/mako/colors"]
hook = "makoctl reload"
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "~/.config/sobarch/tinty-templates/fuzzel"
name = "sobarch-fuzzel"
themes-dir = "colors"
write-to-file = ["~/.config/fuzzel/colors.ini"]
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "~/.config/sobarch/tinty-templates/hyprlock"
name = "sobarch-hyprlock"
themes-dir = "colors"
write-to-file = ["~/.config/hypr/hyprlock.conf"]
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "~/.config/sobarch/tinty-templates/qt6ct"
name = "sobarch-qt6ct"
themes-dir = "colors"
write-to-file = ["~/.config/qt6ct/colors/sobarch.conf"]
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "~/.config/sobarch/tinty-templates/starship"
name = "sobarch-starship"
themes-dir = "colors"
write-to-file = ["~/.config/starship.toml"]
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "~/.config/sobarch/tinty-templates/btop"
name = "sobarch-btop"
themes-dir = "colors"
# A theme file, not btop.conf: btop saves its own settings there.
write-to-file = ["~/.config/btop/themes/sobarch.theme"]
supported-systems = ["base16", "base24", "tinted8"]

[[items]]
path = "~/.config/sobarch/tinty-templates/fastfetch"
name = "sobarch-fastfetch"
themes-dir = "colors"
write-to-file = ["~/.config/fastfetch/config.jsonc"]
supported-systems = ["base16", "base24", "tinted8"]

