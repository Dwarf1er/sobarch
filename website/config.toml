# The URL the site will be built for.
base_url = "https://dwarf1er.github.io/sobarch"
title = "sobarch"
description = "A minimal, reproducible Arch Linux + Hyprland desktop setup."

theme = "adidoks"

default_language = "en"
compile_sass = true
generate_feeds = false
minify_html = true

build_search_index = true

[search]
include_title = true
include_description = true
include_content = true

[markdown.highlighting]
light_theme = "one-light"
dark_theme = "one-dark-pro"

[extra]
author = "Dwarf1er"

language_code = "en-US"
theme_color = "#282c34"

title_separator = "·"
title_addition = "sobarch"

edit_page = true
docs_repo = "https://github.com/Dwarf1er/sobarch"
repo_branch = "master"

math = false

[extra.open]
enable = true
image = "sobarch-wallpaper.png"
og_locale = "en_US"

