[main]
font=D2CodingLigature Nerd Font Mono:size=14
prompt="> "
icon-theme=Papirus-Dark
icons-enabled=yes
lines=8
width=35
horizontal-pad=24
vertical-pad=16
inner-pad=10
include=~/.config/fuzzel/colors.ini

[border]
width=2
radius=8

[key-bindings]
# Vim-style additions layered on fuzzel's own Emacs-style defaults
# (fuzzel.ini(5), KEY BINDINGS). Control+h/j/k/l/u/d all collide with
# fuzzel's own built-in defaults (delete-prev, delete-line-forward,
# delete-line-backward, delete-next -- the last isn't even in the man
# page's documented defaults, found only by testing against the real
# binary's --check-config); a key combo can only map to one action, so
# those are unmapped in favor of full h/j/k/l + d/u symmetry.
# BackSpace/Delete/Control+Shift+BackSpace still cover single-char/
# full-line deletion without them.
next=Down Control+n Control+j
prev=Up Control+p Control+k
cursor-right=Right Control+f Control+l
cursor-left=Left Control+b Control+h
next-page=Page_Down KP_Page_Down Control+d
prev-page=Page_Up KP_Page_Up Control+u
delete-prev=BackSpace
delete-line-forward=none
delete-line-backward=none
delete-next=Delete
